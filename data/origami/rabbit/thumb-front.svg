<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="250" height="350">
<style>
  .card { fill: #f6f1e4; stroke: #c9bfa6; stroke-width: 2; }
  .ink { fill: none; stroke: #4a4538; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .animal { fill: #ffffff; stroke: #4a4538; stroke-width: 2; }
  .scarf  { fill: #4b6f9e; stroke: #4a4538; stroke-width: 2; }
  .plant  { fill: #8aa06a; stroke: #4a4538; stroke-width: 1.5; }
  .accent { fill: #b9443a; stroke: #4a4538; stroke-width: 1.5; }
</style>
<rect class="card" x="1" y="1" width="498" height="698" rx="24"/>

<!-- うさぎ：耳を立てて座る。クローバー、野いちご、たんぽぽ -->
