<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="250" height="350">
<style>
  .card { fill: #f6f1e4; stroke: #c9bfa6; stroke-width: 2; }
  .ink { fill: none; stroke: #4a4538; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .animal { fill: #ffffff; stroke: #4a4538; stroke-width: 2; }
  .black  { fill: #3d3f45; stroke: #4a4538; stroke-width: 2; }
  .crown  { fill: #c8473d; stroke: #4a4538; stroke-width: 1.5; }
  .bag    { fill: #b8913e; stroke: #4a4538; stroke-width: 2; }
  .plant  { fill: #8aa06a; stroke: #4a4538; stroke-width: 1.5; }
</style>
<rect class="card" x="1" y="1" width="498" height="698" rx="24"/>

<!-- 鶴：首を伸ばして立つ。葦、アカマツの枝、水辺 -->
<ellipse class="animal" cx="270" cy="400" rx="95" ry="60"/>
<path class="black" d="M330 410 Q380 430 360 470 Q330 450 320 430 Z"/>
<path class="ink" d="M210 380 Q190 260 215 150" style="stroke-width:14;stroke:#3d3f45"/>
<circle class="animal" cx="220" cy="140" r="20"/>
<circle class="crown" cx="222" cy="128" r="8"/>
<path class="ink" d="M205 142 L160 150"/>
<rect class="bag" x="250" y="420" width="44" height="36" rx="5"/>
<path class="ink" d="M240 370 L270 420"/>
<path class="ink" d="M255 455 L250 610 M285 455 L295 610"/>
<path class="ink" d="M60 640 L440 640" style="stroke:#7d95a6"/>
<path class="plant" d="M70 640 Q80 420 95 300 Q100 420 90 640 Z"/>
<path class="plant" d="M410 640 Q420 450 440 350 Q440 470 430 640 Z"/>
<ellipse class="plant" cx="380" cy="110" rx="70" ry="22"/>
</svg>
