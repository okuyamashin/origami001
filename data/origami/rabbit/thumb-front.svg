<ellipse class="animal" cx="300" cy="180" rx="16" ry="75" transform="rotate(8 300 180)"/>
<path class="scarf" d="M222 330 Q280 365 330 325 L335 345 Q280 385 218 350 Z"/>
<circle class="plant" cx="120" cy="590" r="22"/><circle class="plant" cx="150" cy="575" r="20"/><circle class="plant" cx="135" cy="560" r="18"/>
<circle class="plant" cx="380" cy="600" r="24"/><circle class="plant" cx="405" cy="580" r="18"/>
<circle class="accent" cx="160" cy="620" r="9"/><circle class="accent" cx="350" cy="625" r="9"/>
<circle cx="420" cy="520" r="14" style="fill:#e3b93c;stroke:#4a4538;stroke-width:1.5"/>
</svg>
